<body>
  <h1 class="sr-only">Living AI Orb — Interactive Voice Assistant Particle Visualizer</h1>
  <main class="app">
    <section class="stage" aria-label="Interactive AI voice orb">
      <canvas id="orb"></canvas>
      <div class="status" id="status" aria-live="polite">idle</div>
    </section>
    <section class="controls" aria-label="Orb controls">
      <label class="sr-only" for="text">Text for the assistant to speak</label>
      <textarea id="text">Hello. I am your AI assistant. Ask me anything. I can speak, pulse, deform, and change colour while I talk.</textarea>
      <div class="row">
        <button class="primary" id="speak" type="button">Speak</button>
        <button id="stop" type="button">Stop</button>
        <button id="mic" type="button">Mic reactive</button>
        <button id="shift" type="button">Soft shift</button>
      </div>
      <p class="hint">Hover, touch or click the orb. While the assistant speaks, its perimeter ripples and glows more strongly, then settles back into a calm idle state.</p>
    </section>
  </main>
  <script src="orb.js"></script>
